[project]
name = "astrbot-plugin-chat-helper"
version = "1.0.1"
description = "AstrBot 智能聊天助手插件 - 实时分析对话意图、情绪与风险等级"
authors = [{ name = "AZMIAO" }]
requires-python = ">=3.10"
license = "MIT"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["main.py", "metadata.yaml", "_conf_schema.json", "requirements.txt"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
