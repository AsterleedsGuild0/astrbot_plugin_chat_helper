name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0), only for tag release"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build plugin package
    runs-on: ubuntu-latest
    outputs:
      zip_path: ${{ steps.package.outputs.zip_path }}
      version: ${{ steps.version.outputs.version }}
      is_tag: ${{ steps.version.outputs.is_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML ruff

      - name: Lint scripts
        run: python -m ruff check scripts/package_plugin.py scripts/generate_changelog.py

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            IS_TAG="true"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
            IS_TAG="true"
          else
            VERSION="dev"
            IS_TAG="false"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_tag=$IS_TAG" >> "$GITHUB_OUTPUT"

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.version.outputs.is_tag }}" == "true" ]]; then
            python scripts/package_plugin.py --package-version "${{ steps.version.outputs.version }}"
          else
            python scripts/package_plugin.py --dev-version
          fi

      - name: Resolve package path
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH=$(ls dist/*.zip | head -n1)
          test -f "$ZIP_PATH"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Generate changelog and publish release
    needs: build
    if: needs.build.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate changelog
        shell: bash
        env:
          TAG: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/generate_changelog.py --tag "$TAG" > release-notes.md
          python scripts/generate_changelog.py --all --output CHANGELOG.md
          test -s release-notes.md
          test -s CHANGELOG.md

      - name: Commit changelog
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore 🔧: 更新 CHANGELOG"
          git push origin "HEAD:$DEFAULT_BRANCH"

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-package
          path: assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          files: assets/*.zip
          fail_on_unmatched_files: false
